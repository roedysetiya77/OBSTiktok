<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bubble Live - TikTok Overlay</title>
<style>

/* =========================
RESET
========================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* =========================
HTML BODY
========================= */
html{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  height:100dvh;
  width:100vw;
  margin:0;
  padding:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  font-family:Arial,sans-serif;
}

/* =========================
FRAME TIKTOK PORTRAIT (9:16)
========================= */
.game-frame{
  position:relative;
  width:min(100vw, calc(100dvh * 9 / 16));
  height:100dvh;
  overflow:hidden;
  background: radial-gradient(circle at top, #1b2735 0%, #090a0f 100%);
  border-left: 1px solid rgba(255,255,255,0.08);
  border-right: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 0 35px rgba(0,0,0,0.7);
}

/* Class tambahan saat kamera full menjadi background */
.game-frame.cam-bg {
  background: transparent !important;
}

/* =========================
GAME CANVAS
========================= */
#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index: 1; /* Di depan kamera */
  touch-action: none;
  pointer-events: auto; /* PERBAIKAN: Ubah ke auto agar canvas bisa mendeteksi klik/drag game */
}

/* =========================
SCOREBOARD
========================= */
.scoreboard{
  position:absolute;
  top:14px;
  left:12px;
  right:12px;
  z-index:50;
  display:flex;
  flex-direction:column;
  gap:8px;
  background: rgba(0,0,0,0.72);
  padding:12px;
  border-radius:14px;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(6px);
}

.like-title{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  color:#00d2ff;
}

.total-like-box{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
  color:#fff;
  text-shadow: 0 0 10px rgba(0,210,255,0.8);
}

.total-like-box span{
  color:#00d2ff;
  margin-left:8px;
}

#timeDisplay {
  text-align: center;
  color: #fff;
  font-size: 13px;
}

/* =========================
RUNNING TEXT
========================= */
.running-command{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  overflow:hidden;
  z-index:40;
  background: rgba(15,20,30,0.88);
  border: 1px solid rgba(0,210,255,0.25);
  border-radius:30px;
  padding:6px 0;
  backdrop-filter:blur(4px);
  box-shadow: 0 0 15px rgba(0,210,255,0.12);
}

.running-text{
  display:inline-block;
  white-space:nowrap;
  color:#fff;
  font-size:12px;
  font-weight:bold;
  padding-left:100%;
  text-shadow: 0 0 8px rgba(0,210,255,0.7);
  animation: runningCommand 18s linear infinite;
}

@keyframes runningCommand{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-100%); }
}

/* =========================
RANK BOARD & GIFT PANEL
========================= */
.ranking-board, .gift-info-panel{
  position:absolute;
  top:150px;
  width:135px;
  z-index:20;
  background: rgba(15,20,30,0.92);
  padding:10px;
  border-radius:10px;
  border: 1px solid rgba(0,210,255,0.2);
  transition: 0.3s ease;
}

.ranking-board { left:12px; }
.gift-info-panel { right:12px; }

.ranking-board.hidden{ transform:translateX(-160px); opacity:0; pointer-events:none; }
.gift-info-panel.hidden{ transform:translateX(160px); opacity:0; pointer-events:none; }

.ranking-board h3, .gift-info-panel h4{
  font-size:11px;
  text-align:center;
  color:#f1c40f;
  margin-bottom:6px;
  text-transform:uppercase;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom:3px;
}

.rank-item, .gift-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  margin-bottom:4px;
  color:#eee;
}

.rank-name{
  max-width:75px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.rank-score{
  font-weight:bold;
  color:#00ffcc;
}

/* =========================
CAMERA SYSTEM
========================= */
.camera-wrapper {
  position: absolute;
  top: 155px;
  left: 50%;
  transform: translateX(-50%);
  width: 95px;
  height: 95px;
  border-radius: 50%;
  overflow: hidden;
  
  /* PERBAIKAN SINKRONISASI BACKGROUND */
  z-index: 0; /* Default lingkaran langsung di belakang canvas (z-index 1) */
  /* PERBAIKAN: Defaultnya di-set AUTO agar bisa di-drag saat panel buka */
  pointer-events: auto;
  
  border: 4px solid #00d2ff;
  background: #000;
  box-shadow: 0 0 15px #00d2ff, 0 0 35px rgba(0,210,255,0.5);
  cursor: grab;
  touch-action: none;
}

.camera-wrapper.hidden {
  display: none !important;
}

/* PAS SEBAGAI BACKGROUND GAME FRAME (9:16) */
.camera-wrapper.fullscreen-camera {
  width: 100% !important;
  height: 100% !important;
  border-radius: 0 !important;
  top: 0 !important;
  left: 0 !important;
  transform: none !important;
  border: none !important;
  box-shadow: none !important;
  z-index: 0 !important; /* Tetap di z-index 0 sebagai background */
  cursor: default;
  pointer-events: none;
}

.camera-wrapper video{
  width:100%;
  height:100%;
  object-fit:cover;
  
}

/* =========================
NOTIFICATION & DEBUG
========================= */
.notification-container{
  position:absolute;
  top:310px;
  left:12px;
  width:180px;
  z-index:100;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}

.debug-panel{
  position:absolute;
  right:12px;
  bottom:60px;
  width:150px;
  z-index:600;
  display:flex;
  flex-direction:column;
  gap:6px;
  background: rgba(0,0,0,0.92);
  padding:10px;
  border-radius:10px;
  border: 1px solid rgba(255,255,255,0.15);
  max-height:65vh; /* Sedikit diperbesar agar menampung tombol baru tanpa meluber */
  overflow-y:auto;
  transition:0.3s;
}

.debug-panel.hidden{ transform:translateY(260px); opacity:0; pointer-events:none; }
.debug-panel button{
  border:none;
  border-radius:5px;
  padding:6px;
  background:#333;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}

.debug-panel button:hover{
  background:#444;
}

/* =========================
BOTTOM CONTROLS
========================= */
.bottom-controls{
  position:absolute;
  bottom:18px;
  right:12px;
  display:flex;
  gap:4px;
  z-index:9999;
}

.bottom-controls button{
  border:none;
  padding:8px 12px;
  border-radius:20px;
  background:rgba(0,0,0,0.75);
  color:#fff;
  font-size:11px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.15);
}

/* =========================
CONNECTION STATUS
========================= */
.connection-status{
  position:absolute;
  top:12px;
  left:12px;

  z-index:700;

  display:flex;
  align-items:center;
  gap:6px;

  background:rgba(0,0,0,0.72);
  padding:5px 12px;

  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);

  font-size:11px;
  font-weight:bold;
  color:#fff;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff3333;
}

.status-dot.connected{
  background:#00ff66;
  box-shadow: 0 0 8px #00ff66;
}

@media (max-width:600px){
  .ranking-board, .gift-info-panel{ width:120px; }
}


/* Sembunyikan papan scoreboard total dari layar overlay */
 #scoreboard, .scoreboard, .gift-info-panel, .total-like-box  {
  display: none !important;
}

#simControls{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:99999;
  display:flex;
  gap:10px;
}

#simControls button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#fe2c55;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

#simControls button:hover{
  opacity:0.9;
}

/* ========================================================
   STYLE NOTIFIKASI GIFT PRESTIGE
   ======================================================== */

/* Desain Dasar Notifikasi Gift Modern */

<script>

  const urlParams = new URLSearchParams(window.location.search);
  const ROOM = urlParams.get('room') || '';
  console.log('ROOM:', ROOM);

/* =======================================================
   1. INITIALIZE SOCKET & GLOBAL VARIABLES
======================================================= */
const socket = io(window.location.origin, {
  query: { room: ROOM },
  transports: ['websocket','polling'],
  reconnection: true
});

function proxyImg(url) {
  if (!url || url.trim() === "") return '';
  if (url.includes('placehold.co') || url.includes('picsum.photos')) {
    return url;
  }
  return `/api/proxy-image?url=${encodeURIComponent(url)}`;
}

const userMap = new Map();
const floatingBubbles = [];
const bubbleTextures = {};
let autoLikeInterval = null;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameFrame = document.getElementById('mainGameFrame');

let width = canvas.width = gameFrame.clientWidth;
let height = canvas.height = gameFrame.clientHeight;

function updateCanvasSize() {
  width = canvas.width = gameFrame.clientWidth;
  height = canvas.height = gameFrame.clientHeight;
}
window.addEventListener('resize', updateCanvasSize);

// =====================================================
// TTS VIA SERVER.JS
// =====================================================
let isSpeaking = false;
let ttsQueue = [];

async function speakText(text) {
    if (!text) return;
    text = String(text).trim();
    if (text === '') return;
    ttsQueue.push(text);
    processTtsQueue();
}

async function processTtsQueue() {
    if (isSpeaking) return;
    if (ttsQueue.length === 0) return;

    isSpeaking = true;
    const text = ttsQueue.shift();

    try {
        console.log("REQUEST TTS:", text);
        const response = await fetch('/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

        const raw = await response.text();
        console.log("RAW RESPONSE:", raw);

        let data;
        try {
            data = JSON.parse(raw);
        } catch (jsonErr) {
            console.error("Response bukan JSON:", raw);
            isSpeaking = false;
            processTtsQueue();
            return;
        }

        console.log("TTS RESPONSE:", data);

        if (data.success && data.audioUrl) {
            const audio = new Audio(data.audioUrl);
            audio.volume = 1;
            audio.onended = () => {
                isSpeaking = false;
                processTtsQueue();
            };
            audio.onerror = () => {
                console.log("Audio gagal dimainkan");
                isSpeaking = false;
                processTtsQueue();
            };
            await audio.play();
        } else {
            console.log("TTS gagal:", data.error);
            isSpeaking = false;
            processTtsQueue();
        }
    } catch (err) {
        console.error('TTS ERROR:', err);
        isSpeaking = false;
        processTtsQueue();
    }
}

/* =========================
   2. SPAWN LOGIC
========================= */
function spawnBubble(uniqueId, profilePic) {
  if (userMap.has(uniqueId)) return;
  
  const img = new Image();
  const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232c3e50'/><circle cx='50' cy='45' r='20' fill='%23bdc3c7'/><path d='M20 90 C20 70, 80 70, 80 90' fill='%23bdc3c7'/></svg>";

  let finalUrl = fallbackImg;
  if (profilePic && profilePic.trim() !== "") {
    finalUrl = typeof proxyImg === 'function' ? proxyImg(profilePic) : profilePic;
    img.crossOrigin = "anonymous";
  }

  img.onerror = function() {
    this.removeAttribute('crossOrigin');
    this.src = fallbackImg;
  };
  
  img.src = finalUrl;

  const bubble = {
    id: uniqueId,
    img,
    x: Math.random() * (width - 80) + 40,
    y: Math.random() * (height - 80) + 40,
    radius: 38,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    likes: 0,
    isMain: true,
    created: Date.now()
  };
  
  userMap.set(uniqueId, bubble);
  updateLeaderboard();
}

function spawnLikeBubble(uniqueId, profilePic) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = profilePic || "https://placehold.co/100";

  const main = userMap.get(uniqueId);
  const bubble = {
    id: uniqueId + "_" + Date.now(),
    img,
    x: main ? main.x : Math.random() * width,
    y: main ? main.y : Math.random() * height,
    radius: 18 + Math.random() * 12,
    vx: (Math.random() - 0.5) * 5,
    vy: (Math.random() - 0.5) * 5,
    likes: 0,
    isMain: false,
    created: Date.now(),
    life: 60000
  };
  floatingBubbles.push(bubble);
}

function spawnBubbleClone(user) {
  spawnLikeBubble(user.id, user.img.src);
}

function createGiftExplosion(uniqueId, profilePic) {
  const centerX = width / 2;
  const centerY = height / 2;
  const fallbackImg = "https://placehold.co/100"; 
  const finalUrl = profilePic || fallbackImg;

  const bigImg = new Image();
  bigImg.crossOrigin = "anonymous";
  bigImg.src = finalUrl;

  const randomAngle = Math.random() * 2 * Math.PI;
  const movementSpeed = 6;

  const bigBubble = {
    id: "gift_" + Date.now(),
    img: bigImg,
    x: centerX,
    y: centerY,
    radius: 90,
    vx: Math.cos(randomAngle) * movementSpeed,
    vy: Math.sin(randomAngle) * movementSpeed,
    square: true,
    created: Date.now(),
    life: 8000,
    isMain: false
  };

  bigImg.onerror = function() { this.src = fallbackImg; };
  floatingBubbles.push(bigBubble);

  const totalParticles = 20;
  for (let i = 0; i < totalParticles; i++) {
    const imgParticle = new Image();
    imgParticle.crossOrigin = "anonymous";
    imgParticle.src = finalUrl;

    const angle = (i / totalParticles) * 2 * Math.PI;
    const speed = 4 + Math.random() * 5;

    const bubbleParticle = {
      id: uniqueId + "_gift_part_" + i + "_" + Date.now(),
      img: imgParticle,
      x: centerX,
      y: centerY,
      radius: 15 + Math.random() * 10,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      square: false, 
      likes: 0,
      isMain: false,
      created: Date.now(),
      life: 8000
    };

    imgParticle.onerror = function() { this.src = fallbackImg; };
    floatingBubbles.push(bubbleParticle);
  }

  const chaosInterval = setInterval(() => {
    const exists = floatingBubbles.some(b => b.id === bigBubble.id);
    if (!exists) {
      clearInterval(chaosInterval);
      return;
    }
    const changeAngle = Math.random() * 2 * Math.PI;
    bigBubble.vx = Math.cos(changeAngle) * movementSpeed;
    bigBubble.vy = Math.sin(changeAngle) * movementSpeed;
  }, 250);

  userMap.forEach(player => {
    if (player.id !== uniqueId) {
      player.likes = Math.max(0, player.likes - 5);
    }
  });
}

/* =========================
   3. UPDATE & DRAW ENGINE
========================= */
function updateBubbles() {
  const now = Date.now();

  userMap.forEach(b => {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < b.radius || b.x > width - b.radius) b.vx *= -1;
    if (b.y < b.radius || b.y > height - b.radius) b.vy *= -1;
    b.vx += (Math.random() - 0.5) * 0.05;
    b.vy += (Math.random() - 0.5) * 0.05;
  });

  for (let i = floatingBubbles.length - 1; i >= 0; i--) {
    const b = floatingBubbles[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < b.radius || b.x > width - b.radius) b.vx *= -1;
    if (b.y < b.radius || b.y > height - b.radius) b.vy *= -1;
    if (now - b.created > b.life) {
      floatingBubbles.splice(i, 1);
    }
  }
}

function drawBubble(b) {
  if (!b.img) return;
  ctx.save();

  if (b.square) {
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2, 18);
    } else {
      ctx.rect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
    }
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#fe2c55";
    ctx.clip();
  } else {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.clip();
  }

  let imageDrawn = false;
  if (b.img.complete && b.img.naturalWidth > 0) {
    try {
      ctx.drawImage(b.img, b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
      imageDrawn = true;
    } catch (e) {
      imageDrawn = false;
    }
  }

  if (!imageDrawn) {
    let gradient = ctx.createLinearGradient(b.x - b.radius, b.y - b.radius, b.x + b.radius, b.y + b.radius);
    if (b.square) {
      gradient.addColorStop(0, "#fe2c55");
      gradient.addColorStop(1, "#8e051d");
    } else {
      gradient.addColorStop(0, "#25f4ee");
      gradient.addColorStop(1, "#078a86");
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);

    let initialText = "🎁";
    let targetName = b.senderId || b.id;
    if (targetName && !targetName.startsWith("gift_")) {
      initialText = targetName.charAt(0).toUpperCase();
    }

    ctx.fillStyle = "#ffffff";
    let fontSize = Math.floor(b.radius * 0.9);
    ctx.font = "bold " + fontSize + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(initialText, b.x, b.y);
  }

  ctx.restore();

  if (b.isMain) {
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(b.id, b.x, b.y + b.radius + 16);

    ctx.fillStyle = "#00eaff";
    ctx.fillText("❤ " + b.likes, b.x, b.y + b.radius + 32);
  }
}

function drawBubbles() {
  userMap.forEach(b => drawBubble(b));
  floatingBubbles.forEach(b => drawBubble(b));
}

async function toggleCamera() {
  const wrapper = document.getElementById('cameraWrapper');
  const video = document.getElementById('cameraVideo');

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
    video.srcObject = null;

    wrapper.classList.remove('fullscreen-camera');
    gameFrame.classList.remove('cam-bg');
    wrapper.classList.add('hidden');
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacing }, audio: false });
    video.srcObject = cameraStream;
    video.style.transform = cameraFacing === "user" ? "scaleX(-1)" : "scaleX(1)";
    wrapper.classList.remove('hidden');
  } catch (err) { alert('Kamera tidak ditemukan atau ditolak'); }
}

async function switchCamera(){
  cameraFacing = cameraFacing === "user" ? "environment" : "user";
  if(!cameraStream) return;
  try {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacing }, audio: false });
    const video = document.getElementById("cameraVideo");
    video.srcObject = cameraStream;
    video.style.transform = cameraFacing === "user" ? "scaleX(-1)" : "scaleX(1)";

// DRAG CAMERA CONTROLLER
const cameraWrapper = document.getElementById('cameraWrapper');
let isDragging = false;
let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

// Memastikan kamera langsung dalam kondisi terkunci saat game pertama kali dibuka 
// karena panel pengaturan standarnya adalah tersembunyi (hidden)
if (cameraWrapper) {
  cameraWrapper.classList.add('camera-locked');
}

cameraWrapper.addEventListener('mousedown', startDrag);
cameraWrapper.addEventListener('touchstart', startDrag, { passive: false });

// =========================================================================
// PERBAIKAN LOGIKA DRAG KAMERA (MENDUKUNG LOCK/UNLOCK DARI SIMPANEL)
// =========================================================================
function startDrag(e) {
  if (fullCameraMode) return;

  // Pastikan drag hanya berjalan jika panel sedang terbuka (kamera berada di z-index 25)
  const panel = document.getElementById('simPanel');
  if (panel && panel.classList.contains('hidden')) return;

  isDragging = true;
  cameraWrapper.style.transition = 'none'; // Matikan transisi saat diseret agar mulus
  
  initialLeft = parseFloat(cameraWrapper.style.left) || cameraWrapper.offsetLeft;
  initialTop = parseFloat(cameraWrapper.style.top) || cameraWrapper.offsetTop;
  
  if (e.touches && e.touches.length > 0) {
    startX = e.touches[0].clientX; 
    startY = e.touches[0].clientY;
  } else {
    startX = e.clientX; 
    startY = e.clientY;
  }
}

document.addEventListener('mousemove', dragMove);
document.addEventListener('touchmove', dragMove, { passive: false });

function dragMove(e) {
  if (!isDragging || fullCameraMode) return;
  
  if (e.cancelable) e.preventDefault(); // Cegah layar browser ikut tergulung di HP
  
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  const dx = clientX - startX; 
  const dy = clientY - startY;
  
  cameraWrapper.style.left = `${initialLeft + dx}px`;
  cameraWrapper.style.top = `${initialTop + dy}px`;
}

document.addEventListener('mouseup', stopDrag);
document.addEventListener('touchend', stopDrag);

function stopDrag() { 
  if (!isDragging) return; 
  isDragging = false; 
  
  cameraWrapper.style.transition = 'all 0.3s ease'; // Efek transisi halus saat dilepas
}

function drawFrame() {
  ctx.clearRect(0, 0, width, height);
  updateBubbles();
  drawBubbles();
  requestAnimationFrame(drawFrame);
}

// Inisialisasi awal
updateCanvasSize();

// ===================================
// VIDEO & PHOTO BACKGROUND CONTROLLER
// ===================================
const bgVideo = document.getElementById("bgVideo");
const videoPicker = document.getElementById("videoPicker");
const bgImage = document.getElementById("bgImage");
const imgPicker = document.getElementById("imgPicker");

// ---- 1. Fungsi Video Background ----
function selectBackgroundVideo() {
    if(videoPicker) videoPicker.click();
}

if(videoPicker) {
    videoPicker.addEventListener("change", function(e){
        const file = e.target.files[0];
        if(!file) return;
        
        removeBackgroundImg(); // Nonaktifkan foto jika video dipilih
        
        const url = URL.createObjectURL(file);
        bgVideo.src = url;
        bgVideo.style.display = "block";
        bgVideo.play();
    });
}

function removeBackgroundVideo(){
    if(bgVideo) {
        bgVideo.pause();
        bgVideo.removeAttribute("src");
        bgVideo.load();
        bgVideo.style.display = "none";
    }
}

// ---- 2. Fungsi Foto/Gambar Background ----
function selectBackgroundImg() {
    if(imgPicker) imgPicker.click();
}

if(imgPicker) {
    imgPicker.addEventListener("change", function(e){
        const file = e.target.files[0];
        if(!file) return;

        removeBackgroundVideo(); // Nonaktifkan video jika foto dipilih

        const url = URL.createObjectURL(file);
        bgImage.src = url;
        bgImage.style.display = "block";
    });
}

function removeBackgroundImg(){
    if(bgImage) {
        bgImage.removeAttribute("src");
        bgImage.style.display = "none";
    }
}

// =========================================================================
// FITUR BARU: PENGATUR UKURAN DINAMIS LINGKARAN KAMERA VIA UI SLIDER
// =========================================================================
const camSizeSlider = document.getElementById('camSizeSlider');

if (camSizeSlider) {
  camSizeSlider.addEventListener('input', function(e) {
    // Jika sedang dalam mode Fullscreen Camera, abaikan setelan slider ukuran kecil
    if (fullCameraMode) return;

    const newSize = e.target.value; // Mengambil nilai pixel dari slider (70px - 250px)
    
    // Ubah ukuran wrapper kamera secara dinamis
    cameraWrapper.style.width = `${newSize}px`;
    cameraWrapper.style.height = `${newSize}px`;
    
    // Jamin clip-path tetap berbentuk lingkaran sempurna menyesuaikan ukuran baru
    cameraWrapper.style.borderRadius = "50%"; 
  });
}

drawFrame();
</script>
